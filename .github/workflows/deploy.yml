name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1. BUILD dans le cloud GitHub, push vers ghcr.io
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/infra-bangui/demo-app:latest

  # 2. DÉPLOIEMENT sur app01 via le runner self-hosted (après validation)
  deploy:
    needs: build
    runs-on: [self-hosted, bangui]
    environment: production   # <- déclenche la validation manuelle
    steps:
      - uses: actions/checkout@v4

      - name: Déployer sur app01
        run: |
          scp -o StrictHostKeyChecking=no \
            -i /opt/github-runner/.ssh/deploy_key \
            docker-compose.yml manu@192.168.10.180:/opt/app/docker-compose.yml
          ssh -o StrictHostKeyChecking=no \
            -i /opt/github-runner/.ssh/deploy_key \
            manu@192.168.10.180 \
            "cd /opt/app && \
             echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             docker compose pull && docker compose up -d"
